{# Editor — styles: /static/css/editor.css, scripts: /static/js/editor.js #}
<div style="display:flex;flex-direction:column;flex:1;min-height:0;">
  <div class="editor-toolbar">
    <button id="sidebar-toggle" title="Toggle sidebar" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;cursor:pointer;line-height:1.4;margin-right:4px;"><i class="fas fa-bars"></i></button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
    <button id="reset-btn" title="Reset to original template">↺ Reset</button>
    <button id="lastran-btn" title="Restore last ran code">↻ Last Run</button>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
    <button id="format-btn" title="Format code with Black" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:0.2rem 0.5rem;border-radius:4px;font-size:0.78rem;cursor:pointer;"><i class="fas fa-wand-magic-sparkles"></i></button>
    <span style="flex:1"></span>
    <button id="run-btn" class="btn-accent btn-sm" style="padding:0.3rem 1rem;font-size:0.82rem;"><i class="fas fa-play mr-1"></i>Run</button>
  </div>
  <div class="file-tabs" id="file-tabs"></div>
  <div class="editor-wrapper" id="editor-wrapper"></div>
</div>
