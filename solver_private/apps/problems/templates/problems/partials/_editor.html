<style>
.editor-toolbar {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  padding: 5px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.editor-toolbar select, .editor-toolbar button {
  background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.78rem; cursor: pointer;
}
.editor-toolbar button:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.editor-toolbar select option { background: var(--bg-primary); color: var(--text-primary); }
.editor-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.editor-wrapper .CodeMirror { flex: 1; height: auto !important; }
body.editor-fullscreen .editor-wrapper { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 999; }
.cm-trailingspace { background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH3gUEDgkQM7M5XQAAABl0RVh0Q29tbWVudABDcmVhdGVkIHdpdGggR0lNUFeBDhcAAAASSURBVAjXY2BgYGC4+v9/BgAHigD/7Vh64gAAAABJRU5ErkJggg==); background-position: bottom left; background-repeat: repeat-x; }
.CodeMirror-activeline-background { background: rgba(100, 255, 218, 0.04) !important; }
.CodeMirror-foldgutter-open, .CodeMirror-foldgutter-closed { cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); }
.CodeMirror-foldgutter-open::after { content: '▾'; }
.CodeMirror-foldgutter-closed::after { content: '▸'; }
.CodeMirror-foldgutter-open, .CodeMirror-foldgutter-closed { width: 16px; text-align: center; }
.CodeMirror-hints { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
.CodeMirror-hint { color: var(--text-primary); padding: 0.3rem 0.6rem; }
.CodeMirror-hint-active { background: var(--accent); color: #0a0a0f; }
.CodeMirror-simplescroll-horizontal div, .CodeMirror-simplescroll-vertical div { background: var(--border); border-radius: 4px; }
.editor-actions {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--bg-secondary); border-top: 1px solid var(--border); flex-shrink: 0;
}
</style>
<div style="display:flex;flex-direction:column;flex:1;min-height:0;">
  <div class="editor-toolbar">
    <button title="Toggle sidebar" onclick="var p=document.getElementById('description-panel'),w=document.getElementById('workspace-panel');p.classList.toggle('collapsed');if(p.classList.contains('collapsed')){w.classList.remove('col-lg-7');w.classList.add('col-lg-12');}else{w.classList.remove('col-lg-12');w.classList.add('col-lg-7');}localStorage.setItem('solvespace-sidebar',p.classList.contains('collapsed')?'collapsed':'open');" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;cursor:pointer;line-height:1.4;margin-right:4px;"><i class="fas fa-bars"></i></button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
    <button id="reset-btn" title="Reset to original template">↺ Reset</button>
    <button id="lastran-btn" title="Restore last ran code">↻ Last Run</button>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
    <span style="flex:1"></span>
    <button id="run-btn" class="btn-accent btn-sm" style="padding:0.3rem 1rem;font-size:0.82rem;"><i class="fas fa-play mr-1"></i>Run</button>
  </div>
  <div class="editor-wrapper" id="editor-wrapper"></div>
</div>
<script>
(function() {
  var C = { contestId: {{ problem.contest_id }}, index: '{{ problem.problem_index }}', problemId: {{ problem.id }} };
  var el = function(id) { return document.getElementById(id); };
  var editorEl = el('editor-wrapper');
  var initialCode = {{ (saved_code or base_code)|tojson }};

  var textarea = document.createElement('textarea');
  textarea.id = 'code'; textarea.style.display = 'none';
  textarea.textContent = initialCode;
  editorEl.appendChild(textarea);

  window.editor = CodeMirror.fromTextArea(textarea, {
    lineNumbers: true, autoCloseBrackets: true, matchBrackets: true,
    tabSize: 4, indentUnit: 4, mode: 'python', theme: 'material-darker',
    indentWithTabs: false, electricChars: true, smartIndent: true,
    styleActiveLine: true, showTrailingSpace: true,
    foldGutter: true,
    gutters: ["CodeMirror-foldgutter", "CodeMirror-linenumbers"],
    highlightSelectionMatches: true,
    scrollbarStyle: 'overlay',
    rulers: [{column: 79, color: '#2a2a3e'}],
    keyMap: 'sublime',
    extraKeys: {
      'Ctrl-Enter': function() { el('run-btn').click(); },
      'Cmd-Enter': function() { el('run-btn').click(); },
      'Ctrl-D': function(cm) { cm.execCommand('deleteLine'); },
      'Cmd-D': function(cm) { cm.execCommand('deleteLine'); },
      'Ctrl-S': function() { navigator.sendBeacon('/api/save/' + C.contestId + '/' + C.index, new URLSearchParams({code: window.editor.getValue()})); },
      'Cmd-S': function() { navigator.sendBeacon('/api/save/' + C.contestId + '/' + C.index, new URLSearchParams({code: window.editor.getValue()})); },
      'Ctrl-Space': function(cm) { cm.showHint({hint: CodeMirror.hint.anyword}); }
    }
  });

  var fontSize = 14;
  function applyFontSize() {
    var cm = editorEl.querySelector('.CodeMirror');
    if (cm) { cm.style.fontSize = fontSize + 'px'; window.editor.refresh(); }
  }
  el('font-inc').addEventListener('click', function() { fontSize = Math.min(32, fontSize + 2); applyFontSize(); });
  el('font-dec').addEventListener('click', function() { fontSize = Math.max(8, fontSize - 2); applyFontSize(); });

  var baseCode = {{ base_code|tojson }};
  el('reset-btn').addEventListener('click', function() {
    if (confirm('Reset to original template?')) {
      window.editor.setValue(baseCode); window.editor.focus();
    }
  });
  el('lastran-btn').addEventListener('click', function() {
    fetch('/api/auto-save/' + C.problemId).then(function(r) { return r.json(); }).then(function(d) {
      if (d.last_ran) { window.editor.setValue(d.last_ran); window.editor.focus(); }
      else { alert('No previously run code saved.'); }
    }).catch(function() {});
  });

  var fsActive = false;
  el('fullscreen-btn').addEventListener('click', function() {
    fsActive = !fsActive;
    document.body.classList.toggle('editor-fullscreen', fsActive);
    if (fsActive && editorEl.requestFullscreen) editorEl.requestFullscreen();
    else if (!fsActive && document.exitFullscreen) document.exitFullscreen();
    setTimeout(function() { if (window.editor) window.editor.refresh(); }, 150);
  });
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) { fsActive = false; document.body.classList.remove('editor-fullscreen'); if (window.editor) window.editor.refresh(); }
  });

  var saveTimer;
  window.editor.on('change', function() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() {
      navigator.sendBeacon('/api/save/' + C.contestId + '/' + C.index, new URLSearchParams({code: window.editor.getValue()}));
    }, 500);
  });

  el('run-btn').addEventListener('click', function() {
    jQuery('#solver-modal').modal('show');
    jQuery('#solver-modal').data('action', 'run');
    el('modal-tab-testcases').click();
  });
})();
</script>
