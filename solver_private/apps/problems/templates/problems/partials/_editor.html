<style>
.editor-toolbar {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  padding: 5px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.editor-toolbar button {
  background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.78rem; cursor: pointer;
}
.editor-toolbar button:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.file-tabs { display: flex; align-items: center; background: var(--bg-primary); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; min-height: 32px; }
.file-tab { display: inline-flex; align-items: center; gap: 4px; padding: 0.3rem 0.6rem; font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; border-right: 1px solid var(--border); white-space: nowrap; user-select: none; min-width: 0; }
.file-tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
.file-tab.active { color: var(--text-primary); background: var(--bg-secondary); border-bottom: 2px solid var(--accent); }
.file-tab .tab-close { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; font-size: 0.6rem; border-radius: 2px; color: var(--text-secondary); background: none; border: none; cursor: pointer; padding: 0; line-height: 1; margin-left: 2px; flex-shrink: 0; }
.file-tab .tab-close:hover { background: rgba(248,113,113,0.2); color: #f87171; }
.file-tab-add { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; font-size: 1rem; color: var(--text-secondary); background: none; border: none; cursor: pointer; flex-shrink: 0; margin: 0 2px; }
.file-tab-add:hover { color: var(--accent); }
.editor-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.editor-wrapper .CodeMirror { flex: 1; height: auto !important; }
body.editor-fullscreen .editor-wrapper { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 999; }
.cm-trailingspace { background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH3gUEDgkQM7M5XQAAABl0RVh0Q29tbWVudABDcmVhdGVkIHdpdGggR0lNUFeBDhcAAAASSURBVAjXY2BgYGC4+v9/BgAHigD/7Vh64gAAAABJRU5ErkJggg==); background-position: bottom left; background-repeat: repeat-x; }
.CodeMirror-activeline-background { background: rgba(100, 255, 218, 0.04) !important; }
.CodeMirror-foldgutter-open, .CodeMirror-foldgutter-closed { cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); }
.CodeMirror-foldgutter-open::after { content: '▾'; }
.CodeMirror-foldgutter-closed::after { content: '▸'; }
.CodeMirror-foldgutter-open, .CodeMirror-foldgutter-closed { width: 16px; text-align: center; }
.CodeMirror-hints { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
.CodeMirror-hint { color: var(--text-primary); padding: 0.3rem 0.6rem; }
.CodeMirror-hint-active { background: var(--accent); color: #0a0a0f; }
.CodeMirror-simplescroll-horizontal div, .CodeMirror-simplescroll-vertical div { background: var(--border); border-radius: 4px; }
</style>
<div style="display:flex;flex-direction:column;flex:1;min-height:0;">
  <div class="editor-toolbar">
    <button title="Toggle sidebar" onclick="var p=document.getElementById('description-panel'),w=document.getElementById('workspace-panel');p.classList.toggle('collapsed');if(p.classList.contains('collapsed')){w.classList.remove('col-lg-7');w.classList.add('col-lg-12');}else{w.classList.remove('col-lg-12');w.classList.add('col-lg-7');}localStorage.setItem('solvespace-sidebar',p.classList.contains('collapsed')?'collapsed':'open');" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;cursor:pointer;line-height:1.4;margin-right:4px;"><i class="fas fa-bars"></i></button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
    <button id="reset-btn" title="Reset to original template">↺ Reset</button>
    <button id="lastran-btn" title="Restore last ran code">↻ Last Run</button>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
    <button id="format-btn" title="Format code with Black" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:0.2rem 0.5rem;border-radius:4px;font-size:0.78rem;cursor:pointer;"><i class="fas fa-wand-magic-sparkles"></i></button>
    <span style="flex:1"></span>
    <button id="run-btn" class="btn-accent btn-sm" style="padding:0.3rem 1rem;font-size:0.82rem;"><i class="fas fa-play mr-1"></i>Run</button>
  </div>
  <div class="file-tabs" id="file-tabs"></div>
  <div class="editor-wrapper" id="editor-wrapper"></div>
</div>
<script>
(function() {
  var C = { contestId: {{ problem.contest_id }}, index: '{{ problem.problem_index }}', problemId: {{ problem.id }} };
  var el = function(id) { return document.getElementById(id); };
  var editorEl = el('editor-wrapper');
  var tabsEl = el('file-tabs');
  var baseCode = {{ base_code|tojson }};

  function showConfirm(title, text, cb) {
    document.getElementById('confirm-modal-title').textContent = title;
    document.getElementById('confirm-modal-text').textContent = text;
    var btn = document.getElementById('confirm-modal-yes');
    var handler = function() { btn.removeEventListener('click', handler); jQuery('#confirm-modal').modal('hide'); cb(); };
    btn.addEventListener('click', handler);
    jQuery('#confirm-modal').modal('show');
  }

  function showNewFileModal() {
    var input = document.getElementById('newfile-input');
    input.value = '';
    var btn = document.getElementById('newfile-create-btn');
    var handler = function() {
      btn.removeEventListener('click', handler);
      var name = input.value.trim();
      if (!name) return;
      if (files.some(function(f) { return f.filename === name; })) {
        input.style.borderColor = '#f87171';
        input.setAttribute('placeholder', 'Already exists');
        setTimeout(function() { input.style.borderColor = ''; input.setAttribute('placeholder', 'e.g. approach-b'); }, 1500);
        input.focus();
        input.select();
        return;
      }
      jQuery('#newfile-modal').modal('hide');
      fetch('/api/files/' + C.problemId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: name, code: '' })
      }).then(function(r) { return r.json(); }).then(function() {
        files.push({ filename: name, code: '', last_ran: null });
        switchFile(name);
      });
    };
    btn.addEventListener('click', handler);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') btn.click(); });
    jQuery('#newfile-modal').modal('show');
    setTimeout(function() { input.focus(); }, 300);
  }

  var files = [];
  var activeFile = null;
  var saveTimer;

  function initEditor(code) {
    if (window.editor) { window.editor.setValue(code || ''); window.editor.focus(); return; }
    var textarea = document.createElement('textarea');
    textarea.id = 'code'; textarea.style.display = 'none';
    textarea.textContent = code || '';
    editorEl.appendChild(textarea);
    window.editor = CodeMirror.fromTextArea(textarea, {
      lineNumbers: true, autoCloseBrackets: true, matchBrackets: true,
      tabSize: 4, indentUnit: 4, mode: 'python', theme: 'material-darker',
      indentWithTabs: false, electricChars: true, smartIndent: true,
      styleActiveLine: true, showTrailingSpace: true,
      foldGutter: true,
      gutters: ["CodeMirror-foldgutter", "CodeMirror-linenumbers"],
      highlightSelectionMatches: true,
      scrollbarStyle: 'overlay',
      rulers: [{column: 79, color: '#2a2a3e'}],
      keyMap: 'sublime',
      extraKeys: {
        'Ctrl-Enter': function() { el('run-btn').click(); },
        'Cmd-Enter': function() { el('run-btn').click(); },
        'Ctrl-D': function(cm) { cm.execCommand('deleteLine'); },
        'Cmd-D': function(cm) { cm.execCommand('deleteLine'); },
        'Ctrl-S': function() { saveCurrentFile(); },
        'Cmd-S': function() { saveCurrentFile(); },
        'Ctrl-Space': function(cm) { cm.showHint({hint: CodeMirror.hint.anyword}); }
      }
    });
    window.editor.on('change', function() {
      isDirty = true;
    });

    setInterval(function() {
      if (isDirty && activeFile && window.editor) {
        isDirty = false;
        var code = window.editor.getValue();
        var fd = new URLSearchParams({ code: code, filename: activeFile });
        navigator.sendBeacon('/api/save/' + C.contestId + '/' + C.index, fd);
      }
    }, 1000);
  }

  function saveCurrentFile() {
    if (!activeFile || !window.editor) return;
    var code = window.editor.getValue();
    var fd = new URLSearchParams({ code: code, filename: activeFile });
    navigator.sendBeacon('/api/save/' + C.contestId + '/' + C.index, fd);
    isDirty = false;
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    files.forEach(function(f) {
      var tab = document.createElement('div');
      tab.className = 'file-tab' + (f.filename === activeFile ? ' active' : '');
      tab.dataset.filename = f.filename;
      tab.innerHTML = escHtml(f.filename) + '<button class="tab-close" data-filename="' + escHtml(f.filename) + '">&times;</button>';
      tab.addEventListener('click', function(e) {
        if (e.target.closest('.tab-close')) return;
        switchFile(f.filename);
      });
      tabsEl.appendChild(tab);
    });
    var addBtn = document.createElement('button');
    addBtn.className = 'file-tab-add';
    addBtn.textContent = '+';
    addBtn.title = 'New file';
    addBtn.addEventListener('click', showNewFileModal);
    tabsEl.appendChild(addBtn);
    // Close button handler via delegation
    tabsEl.querySelectorAll('.tab-close').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var name = btn.dataset.filename;
        if (files.length <= 1) return;
        showConfirm('Delete file', 'Delete "' + name + '"?', function() {
          files = files.filter(function(f) { return f.filename !== name; });
          if (activeFile === name) {
            activeFile = files[0] ? files[0].filename : 'main.py';
            switchFile(activeFile);
          }
          renderTabs();
          fetch('/api/files/' + C.problemId + '/' + encodeURIComponent(name), { method: 'DELETE' });
        });
      });
    });
  }

  function switchFile(filename) {
    if (activeFile && window.editor) saveCurrentFile();
    activeFile = filename;
    fetch('/api/auto-save/' + C.problemId + '?filename=' + encodeURIComponent(filename)).then(function(r) { return r.json(); }).then(function(d) {
      var code = d.code || '';
      if (filename === 'main.py' && !code) code = baseCode;
      initEditor(code);
      renderTabs();
    });
  }

  function escHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var fontSize = 14;
  var isDirty = false;

  function applyFontSize() { var cm = editorEl.querySelector('.CodeMirror'); if (cm) { cm.style.fontSize = fontSize + 'px'; if (window.editor) window.editor.refresh(); } }
  el('font-inc').addEventListener('click', function() { fontSize = Math.min(32, fontSize + 2); applyFontSize(); });
  el('font-dec').addEventListener('click', function() { fontSize = Math.max(8, fontSize - 2); applyFontSize(); });
  el('reset-btn').addEventListener('click', function() { showConfirm('Reset code', 'Reset to original template?', function() { window.editor.setValue(baseCode); window.editor.focus(); }); });
  el('lastran-btn').addEventListener('click', function() {
    fetch('/api/auto-save/' + C.problemId + '?filename=' + encodeURIComponent(activeFile || 'main.py')).then(function(r) { return r.json(); }).then(function(d) {
      if (d.last_ran) { window.editor.setValue(d.last_ran); window.editor.focus(); }
      else { alert('No previously run code saved.'); }
    }).catch(function() {});
  });
  var fsActive = false;
  el('fullscreen-btn').addEventListener('click', function() {
    fsActive = !fsActive;
    document.body.classList.toggle('editor-fullscreen', fsActive);
    if (fsActive && editorEl.requestFullscreen) editorEl.requestFullscreen();
    else if (!fsActive && document.exitFullscreen) document.exitFullscreen();
    setTimeout(function() { if (window.editor) window.editor.refresh(); }, 150);
  });
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) { fsActive = false; document.body.classList.remove('editor-fullscreen'); if (window.editor) window.editor.refresh(); }
  });
  el('run-btn').addEventListener('click', function() {
    jQuery('#solver-modal').modal('show');
    jQuery('#solver-modal').data('action', 'run');
    el('modal-tab-testcases').click();
  });
  el('format-btn').addEventListener('click', function() {
    var btn = el('format-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    fetch('/api/format', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ code: window.editor.getValue() })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.formatted) { window.editor.setValue(d.formatted); window.editor.focus(); }
      else if (d.error) { alert('Format error: ' + d.error); }
    }).catch(function(e) { alert('Format failed: ' + e.message); }).finally(function() {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i>';
    });
  });

  // Load files
  fetch('/api/files/' + C.problemId).then(function(r) { return r.json(); }).then(function(data) {
    if (data.length === 0) {
      fetch('/api/files/' + C.problemId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: 'main.py', code: baseCode })
      }).then(function(r) { return r.json(); }).then(function() {
        files = [{ filename: 'main.py', code: baseCode, last_ran: null }];
        switchFile('main.py');
      });
    } else {
      files = data;
      switchFile(activeFile || 'main.py');
    }
  });
})();
</script>
