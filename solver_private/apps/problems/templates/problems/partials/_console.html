<div id="console" class="console-panel">
  <div id="console-resize-handle" class="console-resize-handle"></div>

  <div class="console-header">
    <div class="console-tabs">
      <button class="console-tab active" data-tab="testcase">Testcase</button>
      <button class="console-tab" data-tab="result">Result</button>
    </div>
    <button id="console-toggle" class="console-toggle" title="Toggle Console">
      <i class="fas fa-chevron-down"></i>
    </button>
  </div>

  <div class="console-body">
    <div id="console-pane-testcase" class="console-pane active">
      <div class="tc-tabs-wrapper">
        <div id="tc-tabs" class="tc-tabs">
          <div class="tc-tab active" data-idx="0">Case 1</div>
          <button id="tc-add" class="tc-add" title="Add test case">+</button>
        </div>
      </div>

      <div class="tc-content">
        <div class="tc-toolbar">
          <button id="tc-source-toggle" class="tc-source-btn" title="Toggle raw stdin mode"><code>&lt;/&gt;</code> Source</button>
        </div>
        <div class="tc-input-group">
          <label class="tc-label">Args (JSON)</label>
          <textarea id="tc-input" class="tc-textarea" placeholder='e.g. [5] or [2, 3]' spellcheck="false"></textarea>
        </div>
        <div class="tc-input-group">
          <label class="tc-label">Expected Output</label>
          <textarea id="tc-expected" class="tc-textarea" placeholder="Expected stdout..." spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <div id="console-pane-result" class="console-pane">
      <div id="result-status" class="result-status">
        <span id="result-badge" class="result-badge verdict-pending">Pending</span>
        <span id="result-runtime" class="result-metric" style="display:none;"><i class="fas fa-clock"></i> <span id="result-runtime-val">0</span></span>
        <span id="result-memory" class="result-metric" style="display:none;"><i class="fas fa-microchip"></i> <span id="result-memory-val">0</span></span>
      </div>

      <div id="result-comparison" class="result-comparison" style="display:none;">
        <table class="result-table">
          <thead><tr><th>#</th><th>Result</th><th>Args</th><th>Expected</th><th>Got</th><th>Time</th><th></th></tr></thead>
          <tbody id="result-table-body"></tbody>
        </table>
      </div>

      <div id="result-stdout" class="result-collapsible" style="display:none;">
        <details>
          <summary class="result-summary">stdout (click to expand)</summary>
          <pre id="result-stdout-content" class="result-pre"></pre>
        </details>
      </div>

      <div id="result-error" class="result-error" style="display:none;">
        <pre id="result-error-content" class="result-pre error"></pre>
      </div>

      <div id="result-spinner" class="result-spinner" style="display:none;">
        <div class="spinner"></div>
        <span id="result-spinner-text">Running...</span>
      </div>
    </div>
  </div>
</div>

<style>
.console-panel {
  background: #0d0d14;
  border: 1px solid var(--border);
  border-radius: 8px 8px 0 0;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: flex 0.2s ease, min-height 0.2s ease;
  flex: 0 0 0;
  min-height: 36px;
  overflow: hidden;
}
.console-panel:not(.collapsed) {
  flex: 0 0 250px;
  min-height: 120px;
}
.console-resize-handle {
  height: 4px;
  background: transparent;
  cursor: ns-resize;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.console-resize-handle:hover,
.console-resize-handle:active {
  background: var(--accent);
}
.console-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  padding-right: 4px;
}
.console-tabs {
  display: flex;
}
.console-tab {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0.5rem 1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.console-tab:hover {
  color: var(--text-primary);
}
.console-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.console-toggle {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: color 0.15s, transform 0.2s;
}
.console-toggle:hover {
  color: var(--text-primary);
}
.console-panel.collapsed .console-toggle i {
  transform: rotate(0deg);
}
.console-panel:not(.collapsed) .console-toggle i {
  transform: rotate(180deg);
}
.console-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.console-pane {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
.console-pane.active {
  display: flex;
}

/* Test case tabs */
.tc-tabs-wrapper {
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tc-tabs {
  display: flex;
  align-items: center;
  overflow-x: auto;
  padding: 0 4px;
}
.tc-tab {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0.35rem 0.6rem;
  font-size: 0.78rem;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  user-select: none;
  transition: color 0.15s, border-color 0.15s;
}
.tc-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tc-tab:hover {
  color: var(--text-primary);
}
.tc-tab .tc-tab-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  font-size: 0.65rem;
  border-radius: 2px;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  margin-left: 2px;
}
.tc-tab .tc-tab-close:hover {
  background: rgba(248, 113, 113, 0.2);
  color: #f87171;
}
.tc-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.35rem 0.5rem;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.15s;
}
.tc-add:hover {
  color: var(--accent);
}

/* Test case content */
.tc-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0.5rem;
  gap: 0.5rem;
  overflow-y: auto;
}
.tc-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.tc-source-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 0.72rem;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tc-source-btn:hover {
  color: var(--text-primary);
  border-color: var(--accent);
}
.tc-source-btn.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: var(--accent);
}
.tc-input-group {
  display: flex;
  flex-direction: column;
}
.tc-input-group:last-child {
}
.tc-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-secondary);
  margin-bottom: 3px;
}
.tc-textarea {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  padding: 0.5rem;
  resize: vertical;
  outline: none;
  min-height: 40px;
  overflow: hidden;
}
.tc-textarea:focus {
  border-color: var(--accent);
}

/* Result pane */
.result-status {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0.75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.result-badge {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.result-badge.accepted {
  background: rgba(74, 222, 128, 0.15);
  color: #4ade80;
}
.result-badge.wrong-answer {
  background: rgba(248, 113, 113, 0.15);
  color: #f87171;
}
.result-badge.time-limit-exceeded {
  background: rgba(251, 191, 36, 0.15);
  color: #fbbf24;
}
.result-badge.runtime-error {
  background: rgba(248, 113, 113, 0.15);
  color: #f87171;
}
.result-badge.pending {
  background: rgba(136, 136, 160, 0.15);
  color: var(--text-secondary);
}
.result-metric {
  font-size: 0.78rem;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.result-comparison {
  overflow-y: auto;
  flex: 1;
  border-bottom: 1px solid var(--border);
}
.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
  font-family: 'JetBrains Mono', monospace;
}
.result-table th {
  background: #0a0a0f;
  color: var(--text-secondary);
  font-weight: 600;
  text-align: left;
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}
.result-table td {
  padding: 0.35rem 0.6rem;
  border-bottom: 1px solid rgba(42, 42, 62, 0.5);
  vertical-align: top;
  white-space: pre-wrap;
  word-break: break-all;
  max-width: 200px;
  overflow: hidden;
}
.result-table td.cell-clamped {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  cursor: pointer;
}
.result-table td.cell-clamped.expanded {
  -webkit-line-clamp: unset;
}
.result-table tr:nth-child(even) td {
  background: rgba(18, 18, 26, 0.5);
}
.result-table td.pass {
  color: #4ade80;
}
.result-table td.fail {
  color: #f87171;
}
.result-collapsible {
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.result-summary {
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 0.4rem 0.75rem;
  cursor: pointer;
  user-select: none;
}
.result-summary:hover {
  color: var(--text-primary);
}
.result-pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  padding: 0.5rem 0.75rem;
  margin: 0;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
  color: var(--text-primary);
  background: rgba(10, 10, 15, 0.5);
}
.result-pre.error {
  color: #f87171;
}
.result-error {
  flex: 1;
  overflow-y: auto;
}
.result-spinner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex: 1;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

/* CSS-only spinner */
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Collapsed state */
.console-panel.collapsed .console-body {
  display: none;
}
</style>

<script>
(function() {
  var testCases = [];

  function _autosize(el) { el.style.height = ''; el.style.height = Math.max(el.value.split('\n').length * 20 + 16, 40) + 'px'; }
  document.addEventListener('input', function(e) {
    if (e.target.classList.contains('tc-textarea')) _autosize(e.target);
  });

  function _parseJSON(val) {
    if (!val || !val.trim()) return null;
    try { return JSON.parse(val); } catch(e) { return val; }
  }

  function initTestCase(caseIdx) {
    var i = testCases.findIndex(function(tc) { return tc.idx === caseIdx; });
    if (i === -1) {
      testCases.push({ idx: caseIdx, input: {}, output: null });
    }
  }

  function saveCurrentCase() {
    var activeTab = document.querySelector('#tc-tabs .tc-tab.active');
    if (!activeTab) return;
    var idx = parseInt(activeTab.dataset.idx, 10);
    initTestCase(idx);
    var tc = testCases.find(function(t) { return t.idx === idx; });
    tc.input = _parseJSON(document.getElementById('tc-input').value) || {};
    tc.output = _parseJSON(document.getElementById('tc-expected').value);
  }

  function loadCase(idx) {
    initTestCase(idx);
    var tc = testCases.find(function(t) { return t.idx === idx; });
    var inp = document.getElementById('tc-input');
    inp.value = tc.input && typeof tc.input === 'object' ? JSON.stringify(tc.input, null, 2) : String(tc.input || '');
    _autosize(inp);
    var exp = document.getElementById('tc-expected');
    exp.value = tc.output !== null && tc.output !== undefined ? (typeof tc.output === 'object' ? JSON.stringify(tc.output, null, 2) : String(tc.output)) : '';
    _autosize(exp);
  }

  function switchTab(idx) {
    saveCurrentCase();
    document.querySelectorAll('#tc-tabs .tc-tab').forEach(function(t) {
      t.classList.remove('active');
    });
    var target = document.querySelector('#tc-tabs .tc-tab[data-idx="' + idx + '"]');
    if (target) target.classList.add('active');
    loadCase(idx);
  }

  function addCase() {
    saveCurrentCase();
    var tabs = document.querySelectorAll('#tc-tabs .tc-tab');
    var maxIdx = 0;
    tabs.forEach(function(t) {
      t.classList.remove('active');
      var n = parseInt(t.dataset.idx, 10);
      if (n > maxIdx) maxIdx = n;
    });
    var newIdx = maxIdx + 1;
    var tab = document.createElement('div');
    tab.className = 'tc-tab active';
    tab.dataset.idx = newIdx;
    tab.innerHTML = 'Case ' + (newIdx + 1) + '<button class="tc-tab-close">&times;</button>';
    var addBtn = document.getElementById('tc-add');
    addBtn.parentNode.insertBefore(tab, addBtn);
    loadCase(newIdx);
  }

  function removeCase(idx, tabEl) {
    var tabs = document.querySelectorAll('#tc-tabs .tc-tab');
    if (tabs.length <= 1) return;
    var tc = testCases.find(function(t) { return t.idx === idx; });
    if (tc && (JSON.stringify(tc.input) !== '{}' || tc.output !== null)) {
      if (!confirm('Delete this test case?')) return;
    }
    testCases = testCases.filter(function(t) { return t.idx !== idx; });
    tabEl.remove();
    var remaining = document.querySelectorAll('#tc-tabs .tc-tab');
    if (remaining.length > 0) {
      remaining.forEach(function(t) { t.classList.remove('active'); });
      var first = remaining[0];
      first.classList.add('active');
      loadCase(parseInt(first.dataset.idx, 10));
    }
  }

  function getTestCases() {
    saveCurrentCase();
    var result = [];
    var tabs = document.querySelectorAll('#tc-tabs .tc-tab');
    tabs.forEach(function(t) {
      var idx = parseInt(t.dataset.idx, 10);
      var tc = testCases.find(function(tc) { return tc.idx === idx; });
      if (tc) {
        result.push({ input: tc.input || {}, output: tc.output });
      } else {
        result.push({ input: {}, output: null });
      }
    });
    return result;
  }

  function showSpinner(text) {
    document.querySelectorAll('.console-pane').forEach(function(p) { p.classList.remove('active'); });
    document.querySelector('.console-tab[data-tab="result"]').classList.add('active');
    document.querySelector('.console-tab[data-tab="testcase"]').classList.remove('active');
    document.getElementById('console-pane-result').classList.add('active');

    document.getElementById('result-badge').className = 'result-badge pending';
    document.getElementById('result-badge').textContent = 'Pending';
    document.getElementById('result-runtime').style.display = 'none';
    document.getElementById('result-memory').style.display = 'none';
    document.getElementById('result-comparison').style.display = 'none';
    document.getElementById('result-stdout').style.display = 'none';
    document.getElementById('result-error').style.display = 'none';
    document.getElementById('result-spinner').style.display = 'flex';
    document.getElementById('result-spinner-text').textContent = text || 'Running...';

    var panel = document.getElementById('console');
    if (panel.classList.contains('collapsed')) {
      panel.classList.remove('collapsed');
    }
  }

  function statusToClass(status) {
    switch (status) {
      case 'accepted':
      case 'Accepted': return 'accepted';
      case 'wrong_answer':
      case 'Wrong Answer': return 'wrong-answer';
      case 'time_limit_exceeded':
      case 'Time Limit Exceeded': return 'time-limit-exceeded';
      case 'runtime_error':
      case 'Runtime Error': return 'runtime-error';
      default: return 'pending';
    }
  }

  function statusLabel(status) {
    switch (status) {
      case 'accepted': case 'Accepted': return 'Accepted';
      case 'wrong_answer': case 'Wrong Answer': return 'Wrong Answer';
      case 'time_limit_exceeded': case 'Time Limit Exceeded': return 'Time Limit Exceeded';
      case 'runtime_error': case 'Runtime Error': return 'Runtime Error';
      default: return status || 'Pending';
    }
  }

  function showResult(data) {
    document.getElementById('result-spinner').style.display = 'none';

    var verdict = data.verdict || data.status || 'Pending';
    var badge = document.getElementById('result-badge');
    badge.className = 'result-badge ' + statusToClass(verdict);
    badge.textContent = statusLabel(verdict);

    var rt = data.timing_ms || data.runtime;
    document.getElementById('result-runtime').style.display = rt != null ? 'inline-flex' : 'none';
    if (rt != null) document.getElementById('result-runtime-val').textContent = rt + ' ms';
    var mem = data.memory_kb || data.memory;
    document.getElementById('result-memory').style.display = mem != null ? 'inline-flex' : 'none';
    if (mem != null) document.getElementById('result-memory-val').textContent = mem > 1024 ? (mem/1024).toFixed(1) + ' MB' : mem + ' KB';

    var tbody = document.getElementById('result-table-body');
    tbody.innerHTML = '';
    var comparison = document.getElementById('result-comparison');
    tbody.onclick = function(e) {
      var btn = e.target.closest('.output-btn');
      if (btn) {
        var tr = btn.closest('tr');
        var or = tr && tr.nextElementSibling;
        if (or && or.classList.contains('output-row')) {
          or.style.display = or.style.display === 'none' ? '' : 'none';
          btn.textContent = or.style.display === 'none' ? 'Output' : 'Close';
        }
        return;
      }
      var addBtn = e.target.closest('.add-tc-btn');
      if (addBtn) {
        addTestCaseFromResult(JSON.parse(addBtn.dataset.input), JSON.parse(addBtn.dataset.output));
        return;
      }
      var cell = e.target.closest('.cell-clamped');
      if (cell) {
        cell.classList.toggle('expanded');
      }
    };

    if (data.results && data.results.length > 0) {
      comparison.style.display = 'block';
      data.results.forEach(function(r, i) {
        var status = r.status || (r.passed ? 'passed' : 'failed');
        var statusLabel, statusClass;
        switch (status) {
          case 'passed': statusLabel = 'PASS'; statusClass = 'pass'; break;
          case 'failed': statusLabel = 'FAIL'; statusClass = 'fail'; break;
          case 'skipped': statusLabel = 'SKIP'; statusClass = 'info'; break;
          case 'checked': statusLabel = 'CHECK'; statusClass = 'pass'; break;
          default: statusLabel = status.toUpperCase(); statusClass = 'info';
        }
        var tr = document.createElement('tr');
        tr.dataset.tcIdx = i;
        var timeCell = '';
        if (r.timing_ms != null) {
          var t = r.timing_ms;
          var sol = r.sol_timing;
          if (sol != null) {
          var diff = t - sol;
          var cls = diff > 0.01 ? 'fail' : (diff < -0.01 ? 'pass' : '');
            timeCell = '<td class="' + cls + '">' + sol.toFixed(3) + 'ms';
            if (diff > 0) timeCell += ' <span class="fail">(+' + diff.toFixed(3) + 'ms)</span>';
            else if (diff < 0) timeCell += ' <span class="pass">(' + diff.toFixed(3) + 'ms)</span>';
            timeCell += '</td>';
          } else {
            timeCell = '<td>' + t.toFixed(3) + 'ms</td>';
          }
        } else {
          timeCell = '<td></td>';
        }
        var addBtn = r.input ? '<button class="btn-outline-accent btn-sm add-tc-btn" style="padding:0.1rem 0.4rem;font-size:0.7rem;margin-left:2px;" data-input="' + escHtml(JSON.stringify(r.input)) + '" data-output="' + escHtml(JSON.stringify(r.expected !== undefined ? r.expected : null)) + '">+TC</button>' : '';
        tr.innerHTML =
          '<td>' + (i + 1) + '</td>' +
          '<td class="' + statusClass + '" style="font-weight:600;">' + statusLabel + '</td>' +
          '<td class="' + _cc(r.input) + '">' + escHtml(typeof r.input === 'object' ? JSON.stringify(r.input) : (r.input || '')) + '</td>' +
          '<td class="' + _cc(r.expected) + '">' + escHtml(typeof r.expected === 'object' ? JSON.stringify(r.expected) : (r.expected != null ? String(r.expected) : '')) + '</td>' +
          '<td class="' + _cc(r.got || r.error) + ' ' + (status === 'failed' ? 'fail' : '') + '">' + escHtml(r.got || r.error || '') + '</td>' +
          timeCell +
          '<td>' + (r.stdout || r.error ? '<button class="btn-outline-accent btn-sm output-btn" style="padding:0.1rem 0.4rem;font-size:0.7rem;">Output</button>' : '') + addBtn + '</td>';
        tbody.appendChild(tr);
        if (r.stdout || r.error) {
          var or = document.createElement('tr');
          or.className = 'output-row';
          or.style.display = 'none';
          var tcNum = parseInt(tr.dataset.tcIdx || 0) + 1;
          var timing = r.timing_ms != null ? r.timing_ms + 'ms' : '';
          var mem = r.memory_kb ? (r.memory_kb > 1024 ? (r.memory_kb/1024).toFixed(1) + 'MB' : r.memory_kb + 'KB') : '';
          var footer = '<span style="color:#888;">\u2500 Process exited \u2014 Return Code: ' + (r.passed ? '0' : '1') + '</span>';
          if (timing) footer += ' <span style="color:#888;">\u00b7 Finished at ' + timing + '</span>';
          if (mem) footer += ' <span style="color:#888;">\u00b7 Peak memory: ' + mem + '</span>';
          or.innerHTML = '<td colspan="7"><div style="background:#0d0d14;border:1px solid #2a2a3e;border-radius:6px;overflow:hidden;font-family:\'JetBrains Mono\',monospace;font-size:0.78rem;line-height:1.6;">' +
            '<div style="padding:0.35rem 0.75rem;background:#0a0a0f;border-bottom:1px solid #2a2a3e;color:#64ffda;font-size:0.72rem;">' +
            '<span style="color:#f92672;">bwrap</span><span style="color:#888;">@</span><span style="color:#a6e22e;">ProjectNova</span><span style="color:#888;">:</span> python3 /tmp/temp.py' +
            '</div>' +
            '<pre style="padding:0.75rem;margin:0;color:#e8e8f0;white-space:pre-wrap;word-break:break-all;">' + escHtml(r.stdout || '') + (r.stdout && r.error ? '\n' : '') + escHtml(r.error || '') + '</pre>' +
            '<div style="padding:0.35rem 0.75rem;border-top:1px solid #2a2a3e;font-size:0.72rem;">' + footer + '</div>' +
            '</div></td>';
          tbody.appendChild(or);
        }
      });
    } else {
      comparison.style.display = 'none';
    }

    var err = data.error || '';
    if (data.results) {
      data.results.forEach(function(r) { if (r.error) err += r.error + '\n'; });
    }
    var errorEl = document.getElementById('result-error');
    if (err) {
      document.getElementById('result-error-content').textContent = err;
      errorEl.style.display = 'block';
    } else {
      errorEl.style.display = 'none';
    }
  }

  function showSubmissionResult(data) {
    showResult(data);
  }

  function _cc(val) { var s = String(val || ''); return s.split('\n').length > 5 || s.length > 200 ? 'cell-clamped' : ''; }

  function escHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showModalResult(data) {
    document.getElementById('modal-result-spinner').style.display = 'none';
    var verdict = data.verdict || data.status || 'Pending';
    document.getElementById('modal-result-badge').className = 'result-badge ' + statusToClass(verdict);
    document.getElementById('modal-result-badge').textContent = statusLabel(verdict);
    var rt = data.timing_ms || data.runtime;
    document.getElementById('modal-result-runtime').style.display = rt != null ? 'inline-flex' : 'none';
    if (rt != null) document.getElementById('modal-result-runtime-val').textContent = rt + ' ms';
    var mem = data.memory_kb || data.memory;
    document.getElementById('modal-result-memory').style.display = mem != null ? 'inline-flex' : 'none';
    if (mem != null) document.getElementById('modal-result-memory-val').textContent = mem > 1024 ? (mem/1024).toFixed(1) + ' MB' : mem + ' KB';
    var tbody = document.getElementById('modal-result-body');
    tbody.innerHTML = '';
    var comparison = document.getElementById('modal-result-comparison');
    tbody.onclick = function(e) {
      var btn = e.target.closest('.output-btn');
      if (btn) { var tr = btn.closest('tr'); var or = tr && tr.nextElementSibling; if (or && or.classList.contains('output-row')) { or.style.display = or.style.display === 'none' ? '' : 'none'; btn.textContent = or.style.display === 'none' ? 'Output' : 'Close'; } return; }
      var addBtn = e.target.closest('.add-tc-btn');
      if (addBtn) { addTestCaseFromResult(addBtn.dataset.args, addBtn.dataset.expected); return; }
      var cell = e.target.closest('.cell-clamped');
      if (cell) { cell.classList.toggle('expanded'); }
    };
    if (data.results && data.results.length > 0) {
      comparison.style.display = 'block';
      data.results.forEach(function(r, i) {
        var status = r.status || (r.passed ? 'passed' : 'failed');
        var statusLabel, statusClass;
        switch (status) {
          case 'passed': statusLabel = 'PASS'; statusClass = 'pass'; break;
          case 'failed': statusLabel = 'FAIL'; statusClass = 'fail'; break;
          case 'skipped': statusLabel = 'SKIP'; statusClass = 'info'; break;
          case 'checked': statusLabel = 'CHECK'; statusClass = 'pass'; break;
          default: statusLabel = status.toUpperCase(); statusClass = 'info';
        }
        var tr = document.createElement('tr');
        tr.dataset.tcIdx = i;
        var timeCell = '';
        if (r.timing_ms != null) {
          var t = r.timing_ms;
          var sol = r.sol_timing;
          if (sol != null) {
            var diff = t - sol;
            var cls = diff > 0.01 ? 'fail' : (diff < -0.01 ? 'pass' : '');
            timeCell = '<td class="' + cls + '">' + sol.toFixed(3) + 'ms';
            if (diff > 0) timeCell += ' <span class="fail">(+' + diff.toFixed(3) + 'ms)</span>';
            else if (diff < 0) timeCell += ' <span class="pass">(' + diff.toFixed(3) + 'ms)</span>';
            timeCell += '</td>';
          } else { timeCell = '<td>' + t.toFixed(3) + 'ms</td>'; }
        } else { timeCell = '<td></td>'; }
        var addBtn = r.input ? '<button class="btn-outline-accent btn-sm add-tc-btn" style="padding:0.1rem 0.4rem;font-size:0.7rem;margin-left:2px;" data-input="' + escHtml(JSON.stringify(r.input)) + '" data-output="' + escHtml(JSON.stringify(r.expected !== undefined ? r.expected : null)) + '">+TC</button>' : '';
        tr.innerHTML =
          '<td>' + (i + 1) + '</td>' +
          '<td class="' + statusClass + '" style="font-weight:600;">' + statusLabel + '</td>' +
          '<td class="' + _cc(r.input) + '">' + escHtml(typeof r.input === 'object' ? JSON.stringify(r.input) : (r.input || '')) + '</td>' +
          '<td class="' + _cc(r.expected) + '">' + escHtml(typeof r.expected === 'object' ? JSON.stringify(r.expected) : (r.expected != null ? String(r.expected) : '')) + '</td>' +
          '<td class="' + _cc(r.got || r.error) + ' ' + (status === 'failed' ? 'fail' : '') + '">' + escHtml(r.got || r.error || '') + '</td>' +
          timeCell +
          '<td>' + (r.stdout || r.error ? '<button class="btn-outline-accent btn-sm output-btn" style="padding:0.1rem 0.4rem;font-size:0.7rem;">Output</button>' : '') + addBtn + '</td>';
        tbody.appendChild(tr);
        if (r.stdout || r.error) {
          var or = document.createElement('tr');
          or.className = 'output-row';
          or.style.display = 'none';
          var timing = r.timing_ms != null ? r.timing_ms + 'ms' : '';
          var mem = r.memory_kb ? (r.memory_kb > 1024 ? (r.memory_kb/1024).toFixed(1) + 'MB' : r.memory_kb + 'KB') : '';
          var footer = '<span style="color:#888;">\u2500 Process exited \u2014 Return Code: ' + (r.passed ? '0' : '1') + '</span>';
          if (timing) footer += ' <span style="color:#888;">\u00b7 Finished at ' + timing + '</span>';
          if (mem) footer += ' <span style="color:#888;">\u00b7 Peak memory: ' + mem + '</span>';
          or.innerHTML = '<td colspan="7"><div style="background:#0d0d14;border:1px solid #2a2a3e;border-radius:6px;overflow:hidden;font-family:\'JetBrains Mono\',monospace;font-size:0.78rem;line-height:1.6;">' +
            '<div style="padding:0.35rem 0.75rem;background:#0a0a0f;border-bottom:1px solid #2a2a3e;color:#64ffda;font-size:0.72rem;">' +
            '<span style="color:#f92672;">bwrap</span><span style="color:#888;">@</span><span style="color:#a6e22e;">ProjectNova</span><span style="color:#888;">:</span> python3 /tmp/temp.py</div>' +
            '<pre style="padding:0.75rem;margin:0;color:#e8e8f0;white-space:pre-wrap;word-break:break-all;">' + escHtml(r.stdout || '') + (r.stdout && r.error ? '\n' : '') + escHtml(r.error || '') + '</pre>' +
            '<div style="padding:0.35rem 0.75rem;border-top:1px solid #2a2a3e;font-size:0.72rem;">' + footer + '</div></div></td>';
          tbody.appendChild(or);
        }
      });
    } else { comparison.style.display = 'none'; }
    var err = data.error || '';
    if (data.results) { data.results.forEach(function(r) { if (r.error) err += r.error + '\n'; }); }
    var errorEl = document.getElementById('modal-result-error');
    if (err) { document.getElementById('modal-result-error-content').textContent = err; errorEl.style.display = 'block'; }
    else { errorEl.style.display = 'none'; }
  }

  function showModalSpinner(text) {
    document.getElementById('modal-result-badge').className = 'result-badge pending';
    document.getElementById('modal-result-badge').textContent = 'Pending';
    document.getElementById('modal-result-runtime').style.display = 'none';
    document.getElementById('modal-result-memory').style.display = 'none';
    document.getElementById('modal-result-comparison').style.display = 'none';
    document.getElementById('modal-result-stdout').style.display = 'none';
    document.getElementById('modal-result-error').style.display = 'none';
    document.getElementById('modal-result-spinner').style.display = 'flex';
    document.getElementById('modal-result-spinner-text').textContent = text || 'Running...';
  }

  function appendLog(text, className) {
    // check if log tab exists in parent
    var logEl = document.getElementById('console-log');
    if (logEl) {
      var d = document.createElement('div');
      d.className = className || '';
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  window.consoleApi = {
    showResult: showResult,
    showSubmissionResult: showSubmissionResult,
    showSpinner: showSpinner,
    showModalResult: showModalResult,
    showModalSpinner: showModalSpinner,
    appendLog: appendLog,
    getTestCases: getTestCases
  };

  // --- Event binding ---

  // Console toggle
  document.getElementById('console-toggle').addEventListener('click', function() {
    var panel = document.getElementById('console');
    panel.classList.toggle('collapsed');
    panel.style.flex = '';
    panel.style.minHeight = '';
  });

  // Console tab switching
  document.querySelectorAll('.console-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.console-tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      document.querySelectorAll('.console-pane').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById('console-pane-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Test case tab switching (delegated)
  document.getElementById('tc-tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.tc-tab');
    if (tab) {
      var closeBtn = e.target.closest('.tc-tab-close');
      if (closeBtn) {
        removeCase(parseInt(tab.dataset.idx, 10), tab);
        return;
      }
      switchTab(parseInt(tab.dataset.idx, 10));
    }
  });

  // Add test case
  document.getElementById('tc-add').addEventListener('click', addCase);

  // Source mode toggle
  var sourceToggle = document.getElementById('tc-source-toggle');
  sourceToggle.addEventListener('click', function() {
    sourceToggle.classList.toggle('active');
    var label = document.querySelector('.tc-input-group .tc-label');
    if (sourceToggle.classList.contains('active')) {
      label.textContent = 'Raw stdin';
    } else {
      label.textContent = 'Args (JSON)';
    }
  });

  // Resize handle
  var handle = document.getElementById('console-resize-handle');
  var isResizing = false;
  handle.addEventListener('mousedown', function(e) {
    isResizing = true;
    e.preventDefault();
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function(e) {
    if (!isResizing) return;
    var panel = document.getElementById('console');
    var parent = panel.parentElement;
    var parentRect = parent.getBoundingClientRect();
    var newHeight = parentRect.bottom - e.clientY;
    var minH = 100;
    var maxH = parentRect.height - 60;
    newHeight = Math.max(minH, Math.min(maxH, newHeight));
    panel.style.flex = '0 0 ' + newHeight + 'px';
    panel.style.minHeight = newHeight + 'px';
    if (panel.classList.contains('collapsed')) {
      panel.classList.remove('collapsed');
    }
  });
  document.addEventListener('mouseup', function() {
    if (isResizing) {
      isResizing = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });

  // Load sample test cases from server-embedded data
  var sampleCases = (window.__sampleCases || []).map(function(tc) {
    return { input: typeof tc.input === 'object' ? tc.input : {}, output: tc.output !== undefined ? tc.output : null };
  });
  if (sampleCases.length > 0) {
    testCases = [];
    document.querySelectorAll('#tc-tabs .tc-tab').forEach(function(t) { t.remove(); });
    sampleCases.forEach(function(tc, i) {
      var idx = i;
      var tab = document.createElement('div');
      tab.className = 'tc-tab ' + (i === 0 ? 'active' : '');
      tab.dataset.idx = idx;
      tab.innerHTML = 'Sample ' + (i + 1);
      var addBtn = document.getElementById('tc-add');
      addBtn.parentNode.insertBefore(tab, addBtn);
      testCases.push({ idx: idx, input: tc.input || {}, output: tc.output });
    });
    loadCase(0);
  }
  initTestCase(0);

  function addTestCaseFromResult(input_val, output_val) {
    saveCurrentCase();
    var tabs = document.querySelectorAll('#tc-tabs .tc-tab');
    var maxIdx = 0;
    tabs.forEach(function(t) {
      t.classList.remove('active');
      var n = parseInt(t.dataset.idx, 10);
      if (n > maxIdx) maxIdx = n;
    });
    var newIdx = maxIdx + 1;
    var tab = document.createElement('div');
    tab.className = 'tc-tab active';
    tab.dataset.idx = newIdx;
    tab.innerHTML = 'Case ' + (newIdx + 1) + '<button class="tc-tab-close">&times;</button>';
    var addBtn = document.getElementById('tc-add');
    addBtn.parentNode.insertBefore(tab, addBtn);
    testCases.push({ idx: newIdx, input: typeof input_val === 'object' ? input_val : {}, output: output_val !== undefined ? output_val : null });
    loadCase(newIdx);
    var panel = document.getElementById('console');
    if (panel.classList.contains('collapsed')) panel.classList.remove('collapsed');
    document.querySelector('.console-tab[data-tab="testcase"]').click();
  }

  function pollQueue(queueId, callback) {
    var attempts = 0;
    var poll = setInterval(async function() {
      attempts++;
      try {
        var r = await fetch('/api/queue-status/' + queueId);
        if (!r.ok) { clearInterval(poll); if (callback) callback({ status: 'failed', error: 'Queue not found' }); return; }
        var d = await r.json();
        if (d.status === 'completed' || d.status === 'failed') {
          clearInterval(poll);
          if (callback) callback(d);
        } else if (d.status === 'running') {
          window.consoleApi.appendLog('> Running...', 'info');
        } else if (attempts > 120) {
          clearInterval(poll);
          if (callback) callback({ status: 'failed', error: 'Timed out' });
        }
      } catch(e) { clearInterval(poll); if (callback) callback({ status: 'failed', error: e.message }); }
    }, 1000);
  }

  // Expose run/submit with queue polling
  window.__consoleRun = async function(code, contestId, index) {
    window.consoleApi.showModalSpinner('Running...');
    try {
      var tcs = JSON.stringify(window.consoleApi.getTestCases());
      var body = new URLSearchParams({ code: code, testcases: tcs });
      var r = await fetch('/api/run/' + contestId + '/' + index, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      var data = await r.json();
      window.consoleApi.appendLog('> Queued (#' + data.queue_id + ')', 'info');
      pollQueue(data.queue_id, function(qd) {
        var parsed = { verdict: 'Runtime Error', timing_ms: qd.timing_ms, memory_kb: qd.memory_kb, results: [], stdout: '', error: qd.error };
        try { var jd = JSON.parse(qd.result); parsed.results = jd.results || []; parsed.stdout = jd.stdout || ''; } catch(e) {}
        if (qd.error) { parsed.verdict = 'Runtime Error'; }
        else { var fail = parsed.results.some(function(r) { return !r.passed; }); parsed.verdict = fail ? 'Wrong Answer' : 'Accepted'; }
        window.consoleApi.showModalResult(parsed);
      });
    } catch (e) {
      window.consoleApi.showModalResult({ verdict: 'Runtime Error', error: e.message });
    }
  };

  window.__consoleBenchmark = async function(code, contestId, index) {
    window.consoleApi.showSpinner('Brute forcing...');
    try {
      var r = await fetch('/api/brute-force/' + contestId + '/' + index, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ code: code })
      });
      var data = await r.json();
      window.consoleApi.appendLog('> Queued (#' + data.queue_id + ')', 'info');
      pollQueue(data.queue_id, function(qd) {
        var parsed = { verdict: 'Runtime Error', timing_ms: qd.timing_ms, memory_kb: qd.memory_kb, results: [], stdout: '', error: qd.error };
        try { var jd = JSON.parse(qd.result); parsed.results = jd.results || []; parsed.stdout = jd.stdout || ''; } catch(e) {}
        if (qd.error) { parsed.verdict = 'Runtime Error'; }
        else { var fail = parsed.results.some(function(r) { return !r.passed; }); parsed.verdict = fail ? 'Wrong Answer' : 'Accepted'; }
        window.consoleApi.showResult(parsed);
      });
    } catch (e) {
      window.consoleApi.showResult({ verdict: 'Runtime Error', error: e.message });
    }
  };

  window.__consoleSubmit = async function(code, contestId, index) {
    window.consoleApi.showSpinner('Submitting...');
    try {
      var r = await fetch('/api/submit/' + contestId + '/' + index, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ code: code })
      });
      var data = await r.json();
      window.consoleApi.appendLog('> Queued (#' + data.queue_id + ')', 'info');
      pollQueue(data.queue_id, function(qd) {
        var parsed = { verdict: 'Runtime Error', timing_ms: qd.timing_ms, memory_kb: qd.memory_kb, results: [], stdout: '', error: qd.error, solution_id: qd.solution_id };
        try { var jd = JSON.parse(qd.result); parsed.results = jd.results || []; parsed.stdout = jd.stdout || ''; } catch(e) {}
        if (qd.error) { parsed.verdict = 'Runtime Error'; }
        else { var fail = parsed.results.some(function(r) { return !r.passed; }); parsed.verdict = fail ? 'Wrong Answer' : 'Accepted'; }
        window.consoleApi.showResult(parsed);
        if (qd.solution_id && window.descriptionApi && window.descriptionApi.reloadSubmissions) {
          window.descriptionApi.reloadSubmissions();
        }
      });
    } catch (e) {
      window.consoleApi.showResult({ verdict: 'Runtime Error', error: e.message });
    }
  };
})();
</script>
