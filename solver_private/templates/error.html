{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} — SolveSpace{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card p-5" style="max-width:520px; margin:0 auto; border:1px solid var(--border);">
    <div style="font-family:'JetBrains Mono',monospace; font-size:4.5rem; font-weight:800; color: var(--accent, #64ffda); line-height:1;">{{ code }}</div>
    <h3 class="mt-2">{{ title }}</h3>
    <p class="text-secondary">{{ message }}</p>
    <a href="{{ url_for('problems_blueprint.index') }}" class="btn-accent mt-3" style="display:inline-block; padding:.55rem 1.5rem; background: var(--accent, #64ffda); color: var(--bg-primary, #0a0a0f); border-radius:8px; font-weight:600; text-decoration:none;">Back to Problems</a>
  </div>
</div>
{% endblock %}
