<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}PracticeForge{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.projectnova.download" crossorigin>
    <link rel="stylesheet" href="https://cdn.projectnova.download/flat/dark/theme.css?v=6">
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$','$']],
        displayMath: [['$$','$$']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% block head_extra %}{% endblock %}
    <script src="https://cdn.projectnova.download/shell.js"></script>
</head>
<body>

<nav class="ui-navbar">
  <div class="ui-navbar__inner">
    <span class="ui-navbar__lead" aria-hidden="true"></span>
    <a class="ui-navbar__brand" href="{{ url_for('problems_blueprint.index') }}">~/<span>practiceforge</span></a>
    <div class="ui-navbar__right">
      <ul class="ui-navbar__links">
      <li><a class="ui-navbar__link" href="{{ url_for('problems_blueprint.index') }}">Problems</a></li>
      <li><a class="ui-navbar__link" href="{{ url_for('solutions_blueprint.index') }}">Solutions</a></li>
    </ul>
      <button class="ui-theme-toggle" aria-label="Toggle light/dark"></button>
    </div>
  </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="ui-footer">
  <div class="ui-footer__inner">
    <div>&copy; 2026 Nova. PracticeForge &mdash; Codeforces Practice</div>
    <div><a href="https://github.com/NovaProtocol" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/static/js/error.js"></script>
</body>
</html>
