<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}PracticeForge{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$','$']],
        displayMath: [['$$','$$']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('problems_blueprint.index') }}">~/<span>practiceforge</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" style="border: none; color: var(--text-secondary); font-size: 1.3rem;">
            <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('problems_blueprint.index') }}">Problems</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('solutions_blueprint.index') }}">Solutions</a></li>
                <li class="nav-item">
                    <button id="theme-toggle" class="theme-toggle" title="Switch theme" aria-label="Toggle theme"></button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main style="padding-top: 70px;">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-left mb-2 mb-md-0">
                &copy; 2026 Nova. PracticeForge &mdash; Codeforces Practice
            </div>
            <div class="col-md-6 text-center text-md-right">
                <a href="https://github.com/NovaProtocol" target="_blank" class="mr-3" style="color: var(--text-secondary);"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/error.js"></script>
<script src="/static/js/theme.js"></script>
</body>
</html>
