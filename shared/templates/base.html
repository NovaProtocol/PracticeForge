<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}SolveSpace{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$$$','$$$']],
        displayMath: [['$$$$','$$$$']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a28;
            --border: #2a2a3e;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --accent: #64ffda;
            --accent-dim: rgba(100, 255, 218, 0.1);
            --difficulty-easy: #4ade80;
            --difficulty-medium: #fbbf24;
            --difficulty-hard: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .navbar {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
        }
        .navbar-brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary) !important;
        }
        .navbar-brand span { color: var(--accent); }
        .navbar-nav .nav-link {
            color: var(--text-secondary) !important;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            transition: color 0.2s;
        }
        .navbar-nav .nav-link:hover { color: var(--text-primary) !important; }
        .btn-accent {
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 0.88rem;
            padding: 0.55rem 1.5rem;
            border-radius: 8px;
            border: none;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none !important;
        }
        .btn-accent:hover {
            opacity: 0.85;
            transform: translateY(-1px);
            color: var(--bg-primary);
        }
        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.88rem;
            padding: 0.55rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--accent);
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none !important;
        }
        .btn-outline-accent:hover {
            background: var(--accent-dim);
            color: var(--accent);
        }
        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .section-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }
        .footer {
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .tag {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.2rem 0.65rem;
            border-radius: 4px;
            margin-right: 0.4rem;
            margin-bottom: 0.4rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: default;
            transition: all 0.15s;
        }
        .tag:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-1px);
        }
        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: all 0.2s;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .difficulty-easy { color: var(--difficulty-easy); }
        .difficulty-medium { color: var(--difficulty-medium); }
        .difficulty-hard { color: var(--difficulty-hard); }
        .badge-difficulty {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }
        .badge-easy { background: rgba(74, 222, 128, 0.15); color: var(--difficulty-easy); }
        .badge-medium { background: rgba(251, 191, 36, 0.15); color: var(--difficulty-medium); }
        .badge-hard { background: rgba(248, 113, 113, 0.15); color: var(--difficulty-hard); }
        .form-control {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
        }
        .form-control:focus {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.2rem var(--accent-dim);
        }
        textarea.form-control {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
        }
        .verdict-accepted { color: var(--difficulty-easy); }
        .verdict-wrong { color: var(--difficulty-hard); }
        .verdict-pending { color: var(--text-secondary); }
        .verdict-timeout { color: var(--difficulty-medium); }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('problems_blueprint.index') }}">~/<span>solvespace</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" style="border: none; color: var(--text-secondary); font-size: 1.3rem;">
            <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('problems_blueprint.index') }}">Problems</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('solutions_blueprint.index') }}">Solutions</a></li>
            </ul>
        </div>
    </div>
</nav>

<main style="padding-top: 70px;">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-left mb-2 mb-md-0">
                &copy; 2026 Nova. SolveSpace &mdash; Codeforces Practice
            </div>
            <div class="col-md-6 text-center text-md-right">
                <a href="https://github.com/NovaProtocol" target="_blank" class="mr-3" style="color: var(--text-secondary);"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
