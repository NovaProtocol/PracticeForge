site_name: SolveSpace · Documentation
site_description: Documentation for SolveSpace, Codeforces scraping, AI enrichment, FastAPI solver, bwrap execution sandbox
site_author: SolveSpace
repo_url: https://github.com/NovaProtocol/SolveSpace
repo_name: NovaProtocol/SolveSpace
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Solver Private:
      - solver/index.md
      - Solver API: solver/api-reference.md
      - Problems & Solutions: solver/problems.md
  - Executor:
      - executor/index.md
      - Sandbox & gRPC: executor/sandbox.md
  - Scraper:
      - scraper/index.md
      - Pipeline Stages: scraper/pipeline.md
  - Shared:
      - shared/index.md
      - Models & DB: shared/models.md
  - Docker Infrastructure:
      - docker/index.md
  - API Contract:
      - api-contract/index.md
