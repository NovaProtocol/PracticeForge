services:
  solver_public:
    build:
      context: .
      dockerfile: solver_public/Dockerfile
    container_name: solver_public
    restart: unless-stopped
    ports:
      - "7030:7030"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL:?GATEKEEPER_INTERNAL is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - gatekeeper
      - cloudflared-tunnel

  solver_private:
    build:
      context: .
      dockerfile: solver_private/Dockerfile
    container_name: solver_private
    restart: unless-stopped
    ports:
      - "7031:7030"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  mysql:
    image: mysql:8.4
    container_name: solver_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: solver_phpmyadmin
    restart: unless-stopped
    ports:
      - "7032:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    container_name: solver_executor
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
