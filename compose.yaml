services:
  solver_private:
    build:
      context: .
      dockerfile: solver_private/Dockerfile
    container_name: solver_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
      API_TOKEN: ${API_TOKEN:-}
      EXECUTOR_GRPC_ADDR: ${EXECUTOR_GRPC_ADDR:-solver_executor:50051}
      GRPC_PORT: ${GRPC_PORT:-50051}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - net-executor

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: solver_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:7031:7031"
    depends_on:
      solver_private:
        condition: service_healthy
    networks:
      - default
      - gatekeeper
  mysql:
    image: mysql:8.4
    container_name: solver_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - net-executor

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: solver_phpmyadmin
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    container_name: solver_executor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; from shared.proto_gen import executor_pb2, executor_pb2_grpc; ch=grpc.insecure_channel('127.0.0.1:50051'); stub=executor_pb2_grpc.ExecutorServiceStub(ch); r=stub.HealthCheck(executor_pb2.HealthCheckRequest(), timeout=2); exit(0 if r.status=='ok' else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Root + SYS_ADMIN + unconfined seccomp/apparmor are REQUIRED by the
    # bwrap user-namespace sandbox (see executor/Dockerfile NOTE). Sandboxed
    # code still runs with an empty env + rlimits, it never sees MYSQL_*.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    mem_limit: 1g
    pids_limit: 128
    cpus: "2"
    expose:
      - "50051"
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
      GRPC_PORT: ${GRPC_PORT:-50051}
      EXECUTOR_GRPC_ADDR: ${EXECUTOR_GRPC_ADDR:-solver_executor:50051}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - net-executor

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: solver_documentation
    restart: unless-stopped
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
  net-executor:
    internal: true
  net-data:
    internal: true
  gatekeeper:
    external: true
    name: gatekeeper
