services:
  solver_private:
    build:
      context: .
      dockerfile: solver_private/Dockerfile
    container_name: solver_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7030/api/problems', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: solver_caddy
    restart: unless-stopped
    networks:
      - default
      - gatekeeper
      - cloudflared-tunnel

  mysql:
    image: mysql:8.4
    container_name: solver_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: solver_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:7032:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is required}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    container_name: solver_executor
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    mem_limit: 1g
    pids_limit: 128
    cpus: "2"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASS: ${MYSQL_PASS:?MYSQL_PASS is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solvespace}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
